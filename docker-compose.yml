version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  # 2. Redis Cache
  redis:
    image: redis:alpine
    container_name: erp_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - erp_network

  # 3. pgAdmin 4 (Giao diện quản lý DB)
  pgadmin:
    image: dpage/pgadmin4
    container_name: erp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - erp_network

  # 4. Backend API (NestJS)
  # Lưu ý: Service này sẽ build từ source code trong folder erp-backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_backend_api
    restart: always
    ports:
      - "${PORT}:3000"
    environment:
      - DB_HOST=postgres # Tên service trong network docker
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - erp_network
    # Chạy chế độ dev (hot-reload)
    command: npm run start:dev

volumes:
  postgres_data:

networks:
  erp_network:
    driver: bridge